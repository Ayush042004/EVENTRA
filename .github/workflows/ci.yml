name: CI — Code Integrity & Quality Gate

on:
  push:
    branches:
      - main
      - tb
  pull_request:
    branches:
      - main
      - tb

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend & Contracts Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  backend-check:
    name: Backend Tests & Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Verify Python compilation & syntax
        run: python -m compileall apps/api

      - name: Verify Alembic migrations (dry-run SQL generation)
        run: alembic -c apps/api/alembic.ini upgrade --sql base:head

      - name: Run Pytest test suite
        run: python -m pytest apps/api/tests
